zerops:
  - setup: app
    build:
      base: nodejs@24
      buildCommands:
        - npm install
      deployFiles:
        - .
    run:
      base: nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
      start: npm start

  - setup: prod
    build:
      base: nodejs@24
      buildCommands:
        - npm install
      deployFiles:
        - .
    run:
      base: nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
      start: npm start
